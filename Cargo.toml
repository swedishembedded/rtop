[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Martin Schröder <info@swedishembedded.com>"]
rust-version = "1.89"

[workspace.dependencies]
rtop-core = { path = "crates/rtop-core" }
rtop-linux = { path = "crates/rtop-linux" }
libc = "0.2"
rtop-collectors = { path = "crates/rtop-collectors" }
serde_json = "1"
rtop-runtime = { path = "crates/rtop-runtime" }
rtop-export = { path = "crates/rtop-export" }
crossbeam-channel = "0.5"
rtop-actions = { path = "crates/rtop-actions" }
rtop-app = { path = "crates/rtop-app" }
rtop-tui = { path = "crates/rtop-tui" }
ratatui = "0.30"
unicode-width = "0.2"
proptest = "1.12"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 4
