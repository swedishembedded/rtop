#
# Pushing a semantic version tag (vMAJOR.MINOR.PATCH, created by
# `make release/patch|minor|major`) runs every check and, only when all of
# them pass, builds the binaries and publishes the GitHub release.

name: Release
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Release dry-run ({0})', github.ref_name)
      || format('Release {0}', github.ref_name) }}

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test everything but do not publish a release.
        type: boolean
        default: true

# Read-only for every job: only `publish` may write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  verify:
    name: Checks and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Tag matches the workspace version
        if: github.event_name == 'push'
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != Cargo.toml version $version"; exit 1; }
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - name: Lint
        run: make check
      - name: Tests
        run: make test
      - name: Dependency advisories
        run: |
          cargo install cargo-audit --locked --version 0.23.0
          make check/audit

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            tool: cargo
          - target: x86_64-unknown-linux-musl
            tool: cargo
          - target: aarch64-unknown-linux-musl
            tool: cross
          - target: aarch64-unknown-linux-gnu
            tool: cross
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Install cross
        if: matrix.tool == 'cross'
        run: cargo install cross --git https://github.com/cross-rs/cross --rev a9301e91f72bba3850460512685f6b16062015ff --locked
      - name: Release build
        run: ${{ matrix.tool }} build --release --locked --target ${{ matrix.target }} -p rtop
      - name: Smoke test (native targets)
        if: startsWith(matrix.target, 'x86_64')
        run: |
          bin=target/${{ matrix.target }}/release/rtop
          "$bin" --version
          "$bin" --stats --demo --interval 200ms | head -1 | grep -q '^schema_version: 1$'
          "$bin" --stats --interval 200ms > /dev/null
      - name: Package
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          name="rtop-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/rtop" README.md LICENSE CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rtop-${{ matrix.target }}
          path: dist/

  publish:
    name: Publish GitHub release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.build.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: rtop-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum rtop-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release ${GITHUB_REF_NAME}" > notes.md
          cat notes.md
      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        run: echo "Dry run succeeded; not publishing. Push a vX.Y.Z tag to release."
      - name: Create GitHub release
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          body_path: notes.md
          fail_on_unmatched_files: true
