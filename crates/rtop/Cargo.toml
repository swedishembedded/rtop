[package]
name = "rtop"
description = "Real-time Linux telemetry graph and process manager with a Vim- and mouse-native terminal UI"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["monitor", "top", "linux", "tui", "telemetry"]
categories = ["command-line-utilities"]

[[bin]]
name = "rtop"
path = "src/main.rs"

[dependencies]
rtop-core.workspace = true
rtop-linux.workspace = true
rtop-collectors.workspace = true
rtop-runtime.workspace = true
rtop-export.workspace = true
rtop-app.workspace = true
rtop-tui.workspace = true
rtop-actions.workspace = true
ratatui.workspace = true
crossbeam-channel.workspace = true
signal-hook = "0.3"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
