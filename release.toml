# cargo-release configuration. Usage: make release/patch (or /minor, /major).
#
# On --execute cargo-release bumps the shared workspace version, turns the
# CHANGELOG's Unreleased section into the release's, commits
# "chore: release vX.Y.Z" and creates the annotated tag vX.Y.Z. Pushing the
# branch and the tag (done by hand) starts .github/workflows/release.yml,
# which publishes the GitHub release once every check passes.
push = false
publish = false
sign-tag = false
sign-commit = false
consolidate-commits = true
shared-version = true
allow-branch = ["main"]
tag-name = "v{{version}}"
tag-message = "Release v{{version}}"
pre-release-commit-message = "chore: release v{{version}}"
pre-release-replacements = [
  { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
]
